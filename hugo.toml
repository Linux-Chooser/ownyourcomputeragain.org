baseURL = 'https://ownyourcomputeragain.org/'
languageCode = 'en-us'
title = 'Own Your Computer Again'
theme = 'oyca'

enableRobotsTXT = true
enableGitInfo = false
summaryLength = 40

[frontmatter]
  lastmod = ['last_updated', ':fileModTime']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Linux is a free alternative to Windows and macOS. Learn how to switch, breathe new life into an old computer, and never pay for an OS again."
  author = "THG Media"
  mission = "We exist to help people worldwide reclaim ownership of their computers through education, advocacy, and community."
  goatcounter = "oyca"

[taxonomies]
  tag = "tags"
  category = "categories"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Get Started"
    url = "/get-started/"
    weight = 2

  [[menu.main]]
    name = "Questions"
    url = "/questions/"
    weight = 5

  [[menu.main]]
    name = "Get Help"
    url = "/help/"
    weight = 10
