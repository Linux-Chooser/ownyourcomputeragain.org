- name: "Ritik Singh"
  quote: "Three weeks in, and I'm kicking myself for not doing this sooner. My WiFi worked out of the box. Bluetooth worked. Even my weird USB-C dock just... worked."
  context: "Developer, switched from Windows"
  source_name: "Medium"
  source_url: "https://medium.com/@bitsbyritik/why-switching-to-linux-in-2025-was-the-best-decision-i-made-as-a-developer-6999b704c962"
  source_date: "January 2026"

- name: "Simon Batt"
  quote: "Linux still feels like an operating system, something you can add to, tweak, and remove from at your own leisure. I can't imagine going back into Microsoft's walled garden after breaking out of it."
  context: "Writer, switched from Windows"
  source_name: "XDA Developers"
  source_url: "https://www.xda-developers.com/i-cant-imagine-using-windows-in-2026-after-moving-to-linux/"
  source_date: "January 2026"

- name: "Dan Herbert"
  quote: "It's quite hard to put it into words, but it somehow feels like it respects me more as a user of the system compared to Windows or macOS."
  context: "Switched from Windows"
  source_name: "danherbert.io"
  source_url: "https://danherbert.io/blog/20251118-linux-for-me-in-2026"
  source_date: "November 2025"

- name: "Vivek"
  quote: "When I switched to Linux, I felt like a free bird. Every pixel, every shortcut, every tool is handpicked by me. It's not just a laptop — it's my creation."
  context: "Switched from macOS"
  source_name: "heyvivek.com"
  source_url: "https://heyvivek.com/my-journey-from-macos-to-linux-freedom-tweaks-and-the-joy-of-making-it-mine"
  source_date: "2025"

- name: "Srikant Sahu"
  quote: "Linux felt fast, clean, and refreshing. It finally felt like I was in control of my computer — not the operating system."
  context: "30-day Windows-to-Linux trial"
  source_name: "WindowsPost"
  source_url: "https://windowspost.com/linux-vs-windows-experience/"
  source_date: "May 2026"

- name: "Sae-Hwan Park"
  quote: "Linux no longer feels like a compromise or a statement. It's simply another option in the computing ecosystem — and using it as a daily driver feels remarkably ordinary."
  context: "Returned to Linux after years away"
  source_name: "Medium"
  source_url: "https://medium.com/@saehwanpark/a-second-look-at-linux-reflections-from-2025-f9285809925e"
  source_date: "May 2025"

- name: "David"
  quote: "I've run Linux desktops for over 20 years at this point. Over the last 3 years, I've always known I'd have a stable system, no matter what. There's simply nothing quite like it in terms of reliability."
  context: "20-year Linux user"
  source_name: "davd.io"
  source_url: "https://www.davd.io/posts/2025-12-02-my-linux-setup-2025-2026/"
  source_date: "December 2025"

- name: "Sam"
  quote: "Most newcomers aren't switching because they're 'tech people.' They're switching because they're tired. Tired of forced updates. Tired of bloated systems. Tired of paying for things that should've been free."
  context: "Security writer"
  source_name: "Linux For Everyone"
  source_url: "https://medium.com/linux-for-everyone/why-2025-might-be-the-best-year-ever-to-switch-to-linux-574aa5e37ca3"
  source_date: "December 2025"
